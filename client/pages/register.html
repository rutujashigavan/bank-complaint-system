<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register | Bank System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- CSS -->
<link rel="stylesheet" href="../styles.css">
</head>

<body class="register-page">

<!-- HEADER -->
<header class="reg-header">

  <button class="back-btn" onclick="window.location.href='index.html'">
        ← Back
    </button>  

    <div class="header-title">
        <h2>Secure Bank Complaint Registration</h2>
    </div>


</header>



<!-- MAIN CONTAINER -->
<div class="reg-container">

    <!-- LEFT (1 PART) -->
    <div class="reg-left">

        <!-- TITLE ABOVE GLASS -->
        <div class="left-title">
            <h2>Welcome to Secure Banking</h2>
        </div>

        <!-- GLASS BOX ONLY FOR LIST -->
        <div class="glass-box">
            <ul>
                <li>RBI Verified Banking System</li>
                <li>Secure Customer Authentication</li>
                <li>Complaint Management Access</li>
                <li>24/7 Digital Support</li>
            </ul>
        </div>

    </div>

    <!-- RIGHT (3 PARTS) -->
    <div class="reg-right">

        <div class="form-box">

            <h2>Create Your Account</h2>

            <form id="registerForm">
                
                <br>
                <label> Name: </label>
                <input type="text" id="name" placeholder=" Enter Full Name" required>

                <br>
                <br>
                
                <label> Email: </label>
                <input type="email" id="email" placeholder="Email Address" required>

                <br>
                <br>
                
                <label> Account Number: </label>   
                <input type="text" id="accountNumber" placeholder="Account Number" required>

                <br>
                <br>

                <label> Customer ID: </label>
                <input type="text" id="customerId" placeholder=" Enter Customer ID" required>

                <br>
                <br>
                
                <label> Password: </label>
                <input type="password" id="password" placeholder="Password" required>

                <br>
                <br>

                <label> Confirm Password: </label>
                <input type="password" id="confirmPassword" placeholder="Re-Enter Password" required>

                <br>
                <br>

                <button type="submit">Create Account</button>

                <p class="login-link">
                    Already registered?
                    <a href="login.html">Login here</a>
                </p>

            </form>

        </div>

    </div>

</div>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2026 Secure Bank | All Rights Reserved</p>
  </footer>

<script src="../js/bankDB.js"></script>
<script src="../js/register.js"></script>

</body>
</html>
